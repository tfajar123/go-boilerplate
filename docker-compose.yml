version: '3.9'

services:
  go-boilerplate:
    build: .
    container_name: go-boilerplate
    restart: unless-stopped
    ports:
      - '${APP_PORT}:${APP_PORT}'
    env_file:
      - .env
    environment:
      # Production environment variables
      - APP_ENV=production
      - APP_PORT=${APP_PORT}
      - MONGO_URI=${MONGO_URI}
      - MONGO_DB_NAME=${MONGO_DB_NAME}

      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}

      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_DB=${REDIS_DB}
      - REDIS_USERNAME=${REDIS_USERNAME}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_TLS=${REDIS_TLS}

      - STORAGE_ENDPOINT=${STORAGE_ENDPOINT}
      - STORAGE_ACCESS_KEY=${STORAGE_ACCESS_KEY}
      - STORAGE_SECRET_KEY=${STORAGE_SECRET_KEY}
      - STORAGE_BUCKET=${STORAGE_BUCKET}
      - STORAGE_USE_SSL=${STORAGE_USE_SSL}
      - STORAGE_PUBLIC_URL=${STORAGE_PUBLIC_URL}

      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_FROM_EMAIL=${MAIL_FROM_EMAIL}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME}
      - MAIL_RESET_PASSWORD_URL=${MAIL_RESET_PASSWORD_URL}
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost:3098/health',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.go-api.rule=Host(`api.yourdomain.com`)'
      - 'traefik.http.routers.go-api.entrypoints=websecure'
      - 'traefik.http.routers.go-api.tls.certresolver=letsencrypt'
      - 'traefik.http.services.go-api.loadbalancer.server.port=3098'
      - 'traefik.docker.network=traefik_proxy'
    networks:
      - app-network
      - traefik_proxy
    depends_on:
      mongo-external:
        condition: service_healthy
      redis-external:
        condition: service_healthy

  # External services (for local development/testing only)
  mongo-external:
    image: mongo:7
    container_name: mongo-dev
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongoadmin
      MONGO_INITDB_ROOT_PASSWORD: mongo123
    volumes:
      - mongodata:/data/db
    ports:
      - '27017:27017'
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    profiles:
      - dev

  redis-external:
    image: redis:7-alpine
    container_name: redis-dev
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    profiles:
      - dev

volumes:
  mongodata:
  redis-data:

networks:
  app-network:
    driver: bridge
  traefik_proxy:
    external: true
