root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -gcflags='all=-N -l' -o tmp/main ./apps/cmd/server"
  entrypoint = "tmp/main"
  delay = 500
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "ent", "migrations", "logs", "bin", ".git"]
  exclude_regex = ["_test.go"]
  include_ext = ["go", "tpl", "tmpl", "html"]
  log = "build-errors.log"
  stop_on_error = true
  poll = false
  rerun_delay = 300

[log]
  time = true
